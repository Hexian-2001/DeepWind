# configs/data/train.yaml
# Training data config — matches DeepWindTrainDataset constructor.

# ---- Paths ----
npy_root: "${oc.env:DEEPWIND_DATA_ROOT}/train"
metadata_path: "${oc.env:DEEPWIND_DATA_ROOT}/train_metadata.csv"

# ---- Sequence ----
seq_len: ${model.context_length}
max_vars: 6
pad_val_id: 10

# ---- Dataset-level balanced sampling ----
dataset_weights:
  windtoolkit: 0.9
  scada: 0.1

# ---- Adaptive windowing ----
sample_ratio: 0.005
min_windows_per_file: 4
max_windows_per_file: 128

# ---- IO strategy ----
full_read_coverage_threshold: 0.3

# ---- Iteration ----
repeat: true
seed: ${seed}
