# configs/data_eval/eval.yaml
# Eval data config — matches DeepWindEvalDataset constructor.
# Supports per-group evaluation via eval_groups list.

# ---- Paths ----
npy_root: "/scratch/pawsey0115/hwang4/deepwindData/eval"
metadata_path: "/scratch/pawsey0115/hwang4/deepwindData/eval_metadata.csv"

# ---- Sequence (must match training) ----
seq_len: ${model.context_length}
max_vars: 6
pad_val_id: 10

# ---- Windowing ----
# stride = seq_len (no overlap) by default.
# stride: 4096

# ---- Performance ----
# Cap windows per file to keep eval fast (null = no limit).
max_samples_per_file: 50

# ---- Per-group eval ----
# When set, train.py creates a separate eval dataset per group.
# HF Trainer logs: eval_windtoolkit/loss, eval_scada/loss
eval_groups:
  - "windtoolkit"
  - "scada"