# @package _global_

defaults:
  - _self_
  - model: deepwind_small

run_name: "deepwind_small_fix_sharding_v2"
model_name: "deepwind_small_fix_sharding_v2"
base_dir: "${oc.env:DEEPWIND_RUNS_ROOT}"

seed: 42

data:
  metadata_path: "${oc.env:DEEPWIND_DATA_ROOT}/test_metadata.csv"
  context_length: 8192
  stride: null
  test_npy_paths:
    - "${oc.env:DEEPWIND_DATA_ROOT}/test/30651.npy"
    - "${oc.env:DEEPWIND_DATA_ROOT}/test/43458.npy"
    - "${oc.env:DEEPWIND_DATA_ROOT}/test/75354.npy"
    - "${oc.env:DEEPWIND_DATA_ROOT}/test/76016.npy"
    - "${oc.env:DEEPWIND_DATA_ROOT}/test/csg_wind_5.npy"
    - "${oc.env:DEEPWIND_DATA_ROOT}/test/gefc12_wind_7.npy"
    - "${oc.env:DEEPWIND_DATA_ROOT}/test/gefc14_wind_10.npy"
    - "${oc.env:DEEPWIND_DATA_ROOT}/test/penmanshiel_15.npy"

inference:
  batch_size: 4
  num_workers: 8
  use_amp: false
  horizon_h:
    - 1
    - 2
    - 4
    - 6
    - 8
    - 12
  seasonality_fallback: 96
  mqd_infer: true
  use_kv_cache: null
  checkpoint_path: "${base_dir}/checkpoints/deepwind/${model_name}"
  adapter_path: null
  inference_quantiles:
    - 0.01
    - 0.05
    - 0.10
    - 0.15
    - 0.20
    - 0.25
    - 0.30
    - 0.35
    - 0.40
    - 0.45
    - 0.50
    - 0.55
    - 0.60
    - 0.65
    - 0.70
    - 0.75
    - 0.80
    - 0.85
    - 0.90
    - 0.95
    - 0.99
    
distributed:
  backend: "nccl"
  nproc_per_node: 8

output:
  save_metrics:     true
  save_plots:       false
  save_raw_results: true
  num_plots:        4
  plot_hist_len:    144
  save_rolling_plots:    true
  rolling_plot_segment:  720
  rolling_plot_max_segs:  10
  output_dir: "${base_dir}/results/deepwind/${run_name}"

hydra:
  run:
    dir: ${output.output_dir}
  job:
    chdir: false
