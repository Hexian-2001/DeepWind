# @package _global_

model_name: "deepwind"

model:
  d_model: 64         
  num_layers: 2       
  num_heads: 4        
  d_ff: 256           
  dropout: 0.0        
  
  
  input_patch_size: 8
  input_patch_stride: 8
  context_length: 128  

  quantiles: 
    - 0.01 
    - 0.05 
    - 0.1 
    - 0.15
    - 0.2
    - 0.25
    - 0.3
    - 0.35
    - 0.4
    - 0.45
    - 0.5
    - 0.55
    - 0.6
    - 0.65
    - 0.7
    - 0.75
    - 0.8
    - 0.85
    - 0.9
    - 0.95
    - 0.99

  use_variate_atten: true
  use_variate_embed: true
  use_coord_embed: true
  use_load_balance_loss: true
  use_rotary_emb: false
  use_rms_norm: true
  
  variate_atten_every_n_layers: 2 
  variate_atten_first: false

  use_moe: true
  num_experts: 4            
  num_experts_per_token: 2  
  
  # --- Misc ---
  num_known_variates: 10
  num_patch_stats: 9
  dense_act_fn: "silu"
  use_arcsinh: true