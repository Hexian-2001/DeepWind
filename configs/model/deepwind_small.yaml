# configs/model/deepwind.yaml
# Full DeepWind Model Configuration

# --- Transformer Dimensions ---
d_model: 384
num_layers: 6
num_heads: 6
d_ff: 1024
dropout: 0.05

# --- Patching & Sequence ---
input_patch_size: 16
input_patch_stride: 16
context_length: 8192

# --- Probabilistic Output ---
quantiles:
  - 0.01
  - 0.05
  - 0.1
  - 0.15
  - 0.2
  - 0.25
  - 0.3
  - 0.35
  - 0.4
  - 0.45
  - 0.5
  - 0.55
  - 0.6
  - 0.65
  - 0.7
  - 0.75
  - 0.8
  - 0.85
  - 0.9
  - 0.95
  - 0.99

# --- Feature Switches (Ablations) ---
use_variate_atten: true
use_variate_embed: true
use_coord_embed: true
use_load_balance_loss: true
aux_loss_weight: 0.02
use_rotary_emb: true
use_xpos: true
use_rms_norm: true
use_patch_stats: false

# --- Attention Logic ---
variate_atten_every_n_layers: 2
variate_atten_first: false

# --- MoE Configuration ---
use_moe: true
num_experts: 4
num_experts_per_token: 2

# --- Misc ---
num_known_variates: 10
num_patch_stats: 9
dense_act_fn: "silu"
use_arcsinh: true

# --- Distribution Head ---
pred_head_type: "student_t"   # "quantile" | "student_t" | "zi_beta" | "gmm"
gmm_components: 3             # only used when pred_head_type="gmm"
