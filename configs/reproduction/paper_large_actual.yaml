# Recovered resolved configuration for the checkpoint used by the paper.
# This file records history; do not edit it to match later defaults.
seed: 42
run_name: deepwind_large_v5

model:
  d_model: 1024
  num_layers: 18
  num_heads: 16
  d_ff: 2816
  dropout: 0.1
  input_patch_size: 16
  input_patch_stride: 16
  context_length: 8192
  quantiles: [0.01, 0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90, 0.95, 0.99]
  use_variate_atten: true
  use_variate_embed: true
  use_coord_embed: true
  use_load_balance_loss: true
  aux_loss_weight: 0.01
  use_rotary_emb: false
  use_xpos: true
  use_rms_norm: true
  use_patch_stats: false
  variate_atten_every_n_layers: 2
  variate_atten_first: false
  use_moe: true
  num_experts: 8
  num_experts_per_token: 2
  num_known_variates: 10
  num_patch_stats: 9
  dense_act_fn: silu
  use_arcsinh: true
  pred_head_type: quantile

training:
  learning_rate: 1.0e-4
  weight_decay: 0.01
  adam_beta1: 0.9
  adam_beta2: 0.95
  max_grad_norm: 1.0
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  max_steps: 100000
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  bf16: true
  dataloader_num_workers: 4
  save_steps: 5000
  logging_steps: 50
  eval_steps: 5000

distributed:
  nodes: 2
  devices_per_node: 8
  global_batch_size: 256
