# configs/train.yaml
# Master config — composes model, data, eval, and training configs.

defaults:
  - _self_
  - model: deepwind_small
  - data: train
  - data_eval: eval
  - training: deepwind_small
  - override hydra/job_logging: colorlog
  - override hydra/hydra_logging: colorlog

# Global variables
seed: 42
project_name: "DeepWind-Research"
run_name: "deepwind"

model_name: "deepwind"
train_dataset_name: "deepwind_train"
eval_dataset_name: "deepwind_eval"

results_root: "${oc.env:SCRATCH_ROOT}/results"

wandb:
  project: ${project_name}
  name:    ${run_name}
  tags:    []
  notes:   ""
  dir:     "${results_root}/${project_name}/wandb_cache"   
  
hydra:
  run:
    dir: "${results_root}/${project_name}/logs/train/${run_name}/${now:%Y-%m-%d_%H-%M-%S}"
  sweep:
    dir: "${results_root}/${project_name}/logs/train/${run_name}/sweeps/${now:%Y-%m-%d_%H-%M-%S}"
    subdir: ${hydra.job.num}
  job:
    chdir: true