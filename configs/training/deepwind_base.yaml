# configs/training/deepwind_base.yaml
# Training config for DeepWind-Base
# Paper-exact protocol: 4 nodes × 8 GPUs (32 GPUs),
# global batch = 4 × 2 × 32 = 256, 100,000 steps, peak LR 1e-4,
# warmup 3% (3000 steps), cosine decay, grad clip 1.0, BF16.

# --- Output ---
output_dir: "${results_root}/${project_name}/checkpoints/${model_name}/${run_name}"
overwrite_output_dir: false
run_name: ${run_name}
report_to: "wandb"

# --- Optimization ---
learning_rate: 1e-4
weight_decay: 0.01
adam_beta1: 0.9
adam_beta2: 0.95
max_grad_norm: 1.0

# --- Batch Size & Steps ---
per_device_train_batch_size: 4
gradient_accumulation_steps: 2
max_steps: 100000
lr_scheduler_type: "cosine"
warmup_ratio: 0.03

# --- IterableDataset ---
ignore_data_skip: true

# --- Precision ---
bf16: true

# --- DataLoader ---
dataloader_num_workers: 4
dataloader_pin_memory: true

# --- Checkpoint ---
save_strategy: "steps"
save_steps: 5000
save_total_limit: 5

# --- Logging ---
logging_strategy: "steps"
logging_steps: 100
logging_first_step: true
disable_tqdm: true
log_on_each_node: false

# --- Evaluation ---
eval_strategy: "steps"
eval_steps: 5000
per_device_eval_batch_size: 32
prediction_loss_only: true

# --- Model selection ---
load_best_model_at_end: false

# --- DDP ---
ddp_find_unused_parameters: true
