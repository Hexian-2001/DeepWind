[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepwind-wpf"
version = "0.1.0"
description = "A foundation model for zero-shot probabilistic wind-power forecasting"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Hexian Wang"}]
keywords = ["wind power", "forecasting", "foundation model", "mixture of experts"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "accelerate>=0.26",
  "einops>=0.7",
  "hydra-colorlog>=1.2",
  "hydra-core>=1.3",
  "jaxtyping>=0.2",
  "numpy>=1.26,<3",
  "omegaconf>=2.3",
  "packaging>=23",
  "pandas>=2.0",
  "peft>=0.10",
  "scipy>=1.11",
  "torch>=2.3",
  "tqdm>=4.66",
  "transformers>=4.45,<5",
  "wandb>=0.17",
]

[project.optional-dependencies]
analysis = ["matplotlib>=3.8"]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "safetensors>=0.4",
]

[project.urls]
Homepage = "https://github.com/Hexian-2001/DeepWind"
Paper = "https://doi.org/10.1016/j.energy.2026.141793"
Issues = "https://github.com/Hexian-2001/DeepWind/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
